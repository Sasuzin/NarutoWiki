name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  # Permite publicar manualmente pela aba Actions.
  workflow_dispatch:

# O GITHUB_TOKEN precisa disso para publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 exige ^20.19 || >=22.12.
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Roda tsc --noEmit antes do build: erro de tipo derruba a publicação.
      - name: Build
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir o dist como artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
